<!doctype html>
<html> 
    <head> 
        <meta charset="utf-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <title>网格网址列表</title> 
        <style>
            .nav-grid
            {
                display:flex;
                flex-wrap: wrap;
                list-style-type: none;
                margin: 0;
                padding: 0;
                gap: 5px;
            }
            .nav-grid > .card
            {
                background-color: antiquewhite;
                padding: 15px;
                transition: background-color 0.3s;
            }
            .nav-grid > .card:hover
            {
                background-color: #E8C99B;
            }
            .nav-grid > li > a
            {
                color: black;
                text-decoration: none
            }
</style> 
    </head> 
    <body> 
        <ul class="nav-grid"> 
            <li class="card"> <a href="">test</a> </li> 
            <li class="card"> <a href="">test2</a> </li>
            <li class="card"> <a href="">test2</a> </li>
            <li class="card"> <a href="">test2</a> </li>
            <li class="card"> <a href="">test2</a> </li>
        </ul>  
    </body>
</html>
